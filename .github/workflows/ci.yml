name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 위젯 테스트 (Python)
        run: python -m unittest discover -s widget/tests -v

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: 확장 테스트 (JavaScript)
        run: npm test

  build-windows:
    needs: test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # 크롬 확장 파일과 내장 브라우저(WebView2 / pywebview) 런타임을 exe 안에 함께 넣는다.
      - name: 위젯 exe 만들기
        run: |
          python -m pip install pyinstaller pywebview
          pyinstaller --noconsole --onefile --name AIUsageWidget --paths widget `
            --add-data "extension;extension" `
            --collect-all webview `
            --collect-all pythonnet `
            --collect-all clr_loader `
            --exclude-module PyQt5 --exclude-module PyQt6 --exclude-module PySide2 --exclude-module PySide6 `
            widget/widget.py

      - name: 내장 브라우저 런타임 점검
        shell: pwsh
        run: |
          $p = Start-Process -FilePath ".\dist\AIUsageWidget.exe" -ArgumentList "--check-browser" -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "내장 브라우저 런타임 점검 실패 (ExitCode=$($p.ExitCode))" }

      - name: 확장 압축
        shell: pwsh
        run: Compress-Archive -Path extension/* -DestinationPath ai-usage-extension.zip

      - uses: actions/upload-artifact@v4
        with:
          name: ai-usage-widget-windows
          path: |
            dist/AIUsageWidget.exe
            ai-usage-extension.zip

  # main에 push했을 때 앱 버전(extension/manifest.json)에 해당하는 Release가 아직 없으면 만든다.
  # 즉, 세 파일의 버전을 올려서 push하면 자동으로 새 버전이 배포된다.
  # 위젯의 업데이트 기능은 이 Release의 최신 버전을 확인해서 내려받는다.
  release:
    needs: build-windows
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4

      - name: 새 버전인지 확인
        id: ver
        run: |
          VER=$(python3 -c "import json; print(json.load(open('extension/manifest.json'))['version'])")
          echo "tag=v$VER" >> "$GITHUB_OUTPUT"
          if [ "$GITHUB_REF_TYPE" = "tag" ] && [ "$GITHUB_REF_NAME" != "v$VER" ]; then
            echo "태그($GITHUB_REF_NAME)와 manifest 버전(v$VER)이 달라요"
            exit 1
          fi
          if gh release view "v$VER" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            echo "v$VER Release가 이미 있어요. 건너뜁니다."
            echo "create=false" >> "$GITHUB_OUTPUT"
          else
            echo "create=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/download-artifact@v4
        if: steps.ver.outputs.create == 'true'
        with:
          name: ai-usage-widget-windows
          path: release-files

      - name: Release 만들기
        if: steps.ver.outputs.create == 'true'
        run: |
          EXE=$(find release-files -name AIUsageWidget.exe)
          ZIP=$(find release-files -name ai-usage-extension.zip)
          gh release create "${{ steps.ver.outputs.tag }}" "$EXE" "$ZIP" \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "${{ steps.ver.outputs.tag }}" \
            --generate-notes
