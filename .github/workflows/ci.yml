name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 위젯 테스트 (Python)
        run: python -m unittest discover -s widget/tests -v

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: 확장 테스트 (JavaScript)
        run: npm test

  build-windows:
    needs: test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # 크롬 확장 파일을 exe 안에 함께 넣는다. 위젯이 업데이트될 때 확장 폴더도 같이 바뀐다.
      - name: 위젯 exe 만들기
        run: |
          python -m pip install pyinstaller
          pyinstaller --noconsole --onefile --name AIUsageWidget --paths widget --add-data "extension;extension" widget/widget.py

      - name: 확장 압축
        shell: pwsh
        run: Compress-Archive -Path extension/* -DestinationPath ai-usage-extension.zip

      - uses: actions/upload-artifact@v4
        with:
          name: ai-usage-widget-windows
          path: |
            dist/AIUsageWidget.exe
            ai-usage-extension.zip

  # v로 시작하는 태그(v0.2.0 등)를 push하면 GitHub Release를 만든다.
  # 위젯의 업데이트 기능은 이 Release의 최신 버전을 확인해서 내려받는다.
  release:
    needs: build-windows
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: 태그와 앱 버전이 같은지 확인
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          VER=$(python3 -c "import json; print(json.load(open('extension/manifest.json'))['version'])")
          if [ "$TAG" != "$VER" ]; then
            echo "태그($TAG)와 manifest 버전($VER)이 달라요"
            exit 1
          fi

      - uses: actions/download-artifact@v4
        with:
          name: ai-usage-widget-windows
          path: release-files

      - name: Release 만들기
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          EXE=$(find release-files -name AIUsageWidget.exe)
          ZIP=$(find release-files -name ai-usage-extension.zip)
          gh release create "$GITHUB_REF_NAME" "$EXE" "$ZIP" \
            --repo "$GITHUB_REPOSITORY" \
            --title "$GITHUB_REF_NAME" \
            --generate-notes
