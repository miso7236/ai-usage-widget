<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <link rel="stylesheet" href="popup.css" />
</head>
<body>
  <header>
    <div class="title-group">
      <span class="g-dots" aria-hidden="true">
        <i class="g-blue"></i><i class="g-red"></i><i class="g-yellow"></i><i class="g-green"></i>
      </span>
      <h1>AI 사용량</h1>
    </div>
    <span id="widget-status" class="status-chip"></span>
  </header>

  <div id="notice" class="notice" hidden></div>

  <section id="providers"></section>

  <div class="buttons">
    <button id="refresh" class="btn-primary">지금 새로고침</button>
    <button id="refresh-gemini" class="btn-tonal">Gemini 갱신</button>
  </div>

  <details class="settings-card">
    <summary>설정</summary>
    <div class="settings-body">
      <div class="settings-group">
        <div class="group-title">서비스</div>
        <div class="provider-toggles">
          <label class="chip-check"><input type="checkbox" data-provider="claude" /> Claude</label>
          <label class="chip-check"><input type="checkbox" data-provider="chatgpt" /> ChatGPT</label>
          <label class="chip-check"><input type="checkbox" data-provider="gemini" /> Gemini</label>
        </div>
      </div>

      <div class="settings-group">
        <div class="group-title">갱신</div>
        <label class="setting-row">
          <span>조회 간격(분)</span>
          <input type="number" id="interval" min="1" max="60" />
        </label>
        <label class="setting-check">
          <input type="checkbox" id="gemini-auto" />
          <span>Gemini 자동 갱신 (최소화 창)</span>
        </label>
      </div>

      <div class="settings-group">
        <div class="group-title">알림</div>
        <label class="setting-check">
          <input type="checkbox" id="notify-enabled" />
          <span>사용량 임계치 알림 받기</span>
        </label>
        <label class="setting-row">
          <span>알림 임계치(%)</span>
          <input type="number" id="notify-threshold" min="50" max="100" />
        </label>
        <label class="setting-check">
          <input type="checkbox" id="notify-reset" />
          <span>리셋 완료 알림 받기</span>
        </label>
      </div>
    </div>
  </details>

  <footer id="version" class="muted"></footer>

  <script src="popup.js"></script>
</body>
</html>
